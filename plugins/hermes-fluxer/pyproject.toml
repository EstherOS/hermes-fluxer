[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-fluxer"
version = "1.0.0"
description = "Fluxer chat platform adapter for Hermes Agent — connects fluxer.app and relays messages between Fluxer guilds/DMs and the Hermes agent."
authors = [{name = "NousResearch"}]
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "aiohttp",
    "websockets",
]
optional-dependencies = {realtime = ["hermes-omni"]}

[tool.setuptools.package-dir]
"" = "src"