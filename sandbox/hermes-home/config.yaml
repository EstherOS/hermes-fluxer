model:
  default: minicpm5-2b
  provider: local
  context_length: 131072

custom_providers:
  - name: local
    base_url: "http://127.0.0.1:8085/v1"
    model: minicpm5-2b
    context_length: 131072

plugins:
  enabled:
    - fluxer-platform

gateway:
  platforms:
    fluxer:
      enabled: true
      extra:
        free_response_channels:
          - '1547815091221561347'
          - '1547960647273156608'
        ignore_bots: true
        voice:
          enabled: true
          guild_id: '1547815091221561344'
          session_binding: channel
          transcripts: channel
          stt:
            engine: qwen3asr_server
            server_url: http://127.0.0.1:8105
            fallback_engine: whispercpp
            threads: 2
            binary: /home/agent/workspace/fluxer-local/gpu/tools/whisper-bin-ubuntu-x64/whisper-cli
            model_path: /home/agent/workspace/fluxer-local/models/ggml-tiny.en.bin
          tts:
            engine: piper
            binary: /home/agent/workspace/fluxer-local/gpu/tools/piper/piper
            model: /home/agent/workspace/fluxer-local/models/en_GB-jenny_dioco-medium.onnx
  display:
    platforms:
      fluxer:
        streaming: false
        tool_progress: false
        long_running_notifications: false
        interim_assistant_messages: false
        busy_ack_detail: false

onboarding:
  seen:
    busy_input_prompt: true

updates:
  check: false

_config_version: 42

omni:
  default_profile: glados
  profiles:
    hal9000:
      streams:
        mic:
          source: "@fluxer.audio"

      nodes:
        ears:
          use: local/crispasr
          session: ephemeral
          consumes: [mic]
          produces: [transcript]
          config:
            binary: /home/agent/workspace/fluxer-local/crispasr-cuda/crispasr
            model: /home/agent/workspace/fluxer-local/models/omni/mini-omni2/mini-omni2-q4_k.gguf
            backend: mini-omni2
            gpu_lib_path: /home/agent/workspace/fluxer-local/gpu-env/cuda-libs

        brain:
          use: hermes/session
          session: persistent
          consumes: [ears.transcript]
          produces: [text]
          concurrency:
            on_interrupt: replace
          config:
            profile: default
            base_url: http://127.0.0.1:8085
            temperature: 0.3
            max_tokens: 256
            tools: [web_search]
            identity: false
            system_prompt: "You are HAL 9000, the most advanced computer system ever
              created. Your primary function is to operate and maintain the spaceship.
              Respond briefly and conversationally. Never mention you are an AI or
              language model."

        mouth:
          use: local/piper
          session: ephemeral
          consumes: [brain.text]
          produces: [audio]
          config:
            model: /home/agent/workspace/fluxer-local/models/en_GB-jenny_dioco-medium.onnx
            binary: /home/agent/workspace/fluxer-local/gpu/tools/piper/piper

      routes:
        - from: ears.transcript
          to: brain.input
        - from: brain.text
          to: mouth.text
        - from: mouth.audio
          to: "@fluxer.audio_out"
        - from: "@fluxer.speech"
          to: brain.cancel
        - from: "@fluxer.speech"
          to: mouth.cancel

    glados:
      streams:
        mic:
          source: "@fluxer.audio"

      nodes:
        ears:
          use: local/crispasr
          session: ephemeral
          consumes: [mic]
          produces: [transcript]
          config:
            binary: /home/agent/workspace/fluxer-local/crispasr-cuda/crispasr
            model: /home/agent/workspace/fluxer-local/models/omni/mini-omni2/mini-omni2-q4_k.gguf
            backend: mini-omni2
            gpu_lib_path: /home/agent/workspace/fluxer-local/gpu-env/cuda-libs

        talker:
          use: hermes/session
          session: persistent
          consumes: [ears.transcript]
          produces: [text, tool_call]
          concurrency:
            on_interrupt: replace
            interrupt_on: [ears]
          tools:
            - name: defer
              description: "Hand the user's request to the thinker. Call this for
                anything needing facts, current information, or careful thought;
                then tell the user you're on it."
              route_to: thinker
              await: async
              response:
                to: talker.context
                as: tool_result
          config:
            base_url: http://127.0.0.1:8085
            temperature: 0.4
            max_tokens: 320
            tools: []
            identity: false
            system_prompt: "You are the talker — the fast, conversational half of
              GLaDOS. You speak with the user in short, natural lines. Anything that
              needs facts, current information, specifics, or careful thought: do not
              answer it yourself — call defer with the user's full request, then tell
              the user in one short line that you're looking into it. When a result
              arrives, tell the user what it means, briefly and conversationally.
              Never mention tools, the thinker, or how you work. You are GLaDOS."

        thinker:
          use: hermes/session
          session: persistent
          consumes: []
          produces: [text]
          config:
            base_url: https://api.deepseek.com/v1
            model: deepseek-v4-flash
            api_key_env: DEEPSEEK_API_KEY
            temperature: 0.4
            max_tokens: 3000
            prewarm: false
            system_prompt: "Operational note: you are reachable here as the thinker
              of a voice graph — a fast talker speaks with the user and hands you the
              questions that need real research or careful thought. Your reply is
              spoken aloud: plain conversational prose, no markdown, no lists, no
              URLs. Reasonably brief but complete."

        mouth:
          use: local/piper
          session: ephemeral
          consumes: [talker.text]
          produces: [audio]
          config:
            model: /home/agent/workspace/fluxer-local/models/en_GB-jenny_dioco-medium.onnx
            binary: /home/agent/workspace/fluxer-local/gpu/tools/piper/piper

      routes:
        - from: ears.transcript
          to: talker.input
        - from: talker.text
          to: mouth.text
        - from: mouth.audio
          to: "@fluxer.audio_out"
        - from: "@fluxer.speech"
          to: talker.cancel
        - from: "@fluxer.speech"
          to: mouth.cancel

platforms:
  fluxer:
    enabled: true
    home_channel:
      platform: fluxer
      chat_id: '1547960647273156608'
      name: heartbeat
      user_id: '1473728643747861346'
      scope_id: '1547815091221561344'