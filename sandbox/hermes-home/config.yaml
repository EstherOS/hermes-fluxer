model:
  default: deepseek/deepseek-v4-flash
  provider: openrouter
plugins:
  enabled:
    - fluxer-platform
gateway:
  platforms:
    fluxer:
      enabled: true
      extra:
        free_response_channels:
          - '1547815091221561347'
          - '1547960647273156608'
        ignore_bots: true
        voice:
          enabled: true
          auto_channels:
            - '1547815091221561348'
          guild_id: '1547815091221561344'
          session_binding: channel
          transcripts: channel
          stt:
            engine: qwen3asr_server
            server_url: http://127.0.0.1:8105
            fallback_engine: whispercpp
            threads: 2
            binary: /home/agent/workspace/fluxer-local/gpu/tools/whisper-bin-ubuntu-x64/whisper-cli
            model_path: /home/agent/workspace/fluxer-local/models/ggml-tiny.en.bin
          tts:
            engine: piper
            binary: /home/agent/workspace/fluxer-local/gpu/tools/piper/piper
            model: /home/agent/workspace/fluxer-local/models/en_US-lessac-medium.onnx
  display:
    platforms:
      fluxer:
        streaming: false
        tool_progress: false
        long_running_notifications: false
        interim_assistant_messages: false
        busy_ack_detail: false
onboarding:
  seen:
    busy_input_prompt: true
updates:
  check: false
_config_version: 42
omni:
  default_profile: glados
  profiles:
    # ── v2 profiles (component grammar) ────────────────────────────────────
    jarvis:
      components:
        brain:
          ins:
            text: [user]
            audio: [user]
            image: [user]
            video: [user]
          outs:
            text: [user]
            audio: [user]
          tools:
            harness: core
          io:
            video:
              mode: live
              interrupt: false
            audio:
              mode: live
              interrupt: true

    thinker-talker:
      components:
        talker:
          ins:
            audio: [user]
            text: [thinker]
          outs:
            text: [thinker]
            audio: [user]
          tools:
            defer: thinker
          io:
            audio:
              mode: live
        thinker:
          ins:
            text: [user, talker]
            image: [user]
            video: [user]
          outs:
            text: [user, talker]
          tools:
            harness: core
            image: capture
            video: tape
          io:
            video:
              mode: tape
            image:
              mode: frame

    fast-talker:
      components:
        talker:
          ins:
            audio: [user]
          outs:
            audio: [user]
          tools:
            defer: core
          io:
            audio:
              mode: live
        core:
          ins:
            text: [user]
          outs:
            text: [talker, user]
          tools:
            harness: core

    glados:
      components:
        ears:
          ins:
            audio: [user]
          outs:
            text: [talker]
          io:
            audio:
              mode: live
              interrupt: false
        talker:
          ins:
            text: [ears, thinker]
          outs:
            text: [thinker]
          tools:
            defer: thinker
        thinker:
          ins:
            text: [talker, user]
            image: [user]
            video: [user]
          outs:
            text: [talker, user]
          tools:
            harness: core
            video: tape
          io:
            video:
              mode: tape
            image:
              mode: frame
        mouth:
          ins:
            text: [talker, thinker]
          outs:
            audio: [user]
          io:
            audio:
              mode: live

    # ── v1 profiles (legacy) ───────────────────────────────────────────────
    split-local:
      mode: stitched
      tempo: fast_half_duplex
      bindings:
        audio_in:
          backend: local.whispercpp
          fallback:
            - local.qwen3asr
        audio_out:
          backend: local.piper
        image_in:
          backend: local.smolvlm
        video_in:
          backend: local.smolvlm_video
        text_in:
          backend: agent
        text_out:
          backend: agent
    omni-unified:
      mode: unified
      tempo: realtime
      backend: local.crispasr_stream
      senses:
        - text
        - audio
        - image
        - video
    torch-unified:
      mode: unified
      tempo: realtime
      backend: local.miniomni2_duplex
      senses:
        - text
        - audio
        - image
        - video
    turn-basic:
      mode: unified
      tempo: turn
      backend: local.crispasr_miniomni2
      senses:
        - text
        - audio
platforms:
  fluxer:
    enabled: true
    home_channel:
      platform: fluxer
      chat_id: '1547960647273156608'
      name: heartbeat
      user_id: '1473728643747861346'
      scope_id: '1547815091221561344'

# ── Security ──────────────────────────────────────────────────────────
# Secret redaction is ON by default — strings that look like API keys,
# tokens, and passwords are masked in tool output, logs, and chat
# responses before the model or user ever sees them. Set redact_secrets
# to false to disable (e.g. when developing the redactor itself).
# tirith pre-exec scanning is enabled by default when the tirith binary
# is available. Configure via security.tirith_* keys or env vars
# (TIRITH_ENABLED, TIRITH_BIN, TIRITH_TIMEOUT, TIRITH_FAIL_OPEN).
#
# security:
#   redact_secrets: true
#   tirith_enabled: true
#   tirith_path: "tirith"
#   tirith_timeout: 5
#   tirith_fail_open: true

# ── Fallback Model ────────────────────────────────────────────────────
# Automatic provider failover when primary is unavailable.
# Uncomment and configure to enable. Triggers on rate limits (429),
# overload (529), service errors (503), or connection failures.
#
# Supported providers:
#   openrouter   (OPENROUTER_API_KEY)  — routes to any model
#   openai-codex (OAuth — hermes auth) — OpenAI Codex
#   nous         (OAuth — hermes auth) — Nous Portal
#   zai          (ZAI_API_KEY)         — Z.AI / GLM
#   kimi-coding  (KIMI_API_KEY)        — Kimi / Moonshot
#   kimi-coding-cn (KIMI_CN_API_KEY)   — Kimi / Moonshot (China)
#   minimax      (MINIMAX_API_KEY)     — MiniMax
#   minimax-cn   (MINIMAX_CN_API_KEY)  — MiniMax (China)
#   bedrock      (AWS IAM / boto3)     — AWS Bedrock (Converse API)
#
# For custom OpenAI-compatible endpoints, add base_url and key_env.
#
# fallback_model:
#   provider: openrouter
#   model: anthropic/claude-sonnet-4
